<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牙體復形 3D 數位比對系統 (體積量化版)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #121212; color: #e0e0e0;
            display: flex; height: 100vh; overflow: hidden;
        }
        #sidebar {
            width: 320px; background-color: #1e1e1e; padding: 20px;
            display: flex; flex-direction: column;
            box-shadow: 4px 0 15px rgba(0,0,0,0.6); z-index: 10; box-sizing: border-box;
            overflow-y: auto; /* 💡 防止加上報告後內容太多超出螢幕 */
        }
        #canvas-container { flex: 1; position: relative; width: calc(100% - 320px); height: 100%; }
        h2 { margin-top: 0; color: #ffffff; font-size: 1.2rem; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .file-input-container { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #aaa; }
        input[type="file"] {
            width: 100%; padding: 8px; background: #2a2a2a; border: 1px solid #444;
            color: #fff; border-radius: 4px; box-sizing: border-box; font-size: 0.85rem;
        }
        .slider-container { margin-bottom: 15px; }
        input[type="range"] { width: 100%; margin-top: 5px; }
        
        .layer-control-container {
            background-color: #252525; padding: 12px; border-radius: 6px;
            margin-bottom: 15px; border: 1px solid #333;
        }
        .layer-checkbox {
            display: flex; align-items: center; margin-bottom: 8px;
            cursor: pointer; font-size: 0.9rem; color: #ddd;
        }
        .layer-checkbox:last-child { margin-bottom: 0; }
        .layer-checkbox input { margin-right: 10px; cursor: pointer; }

        /* 💡 新增：體積量化報告面板的 UI 樣式 */
        #volume-results {
            background-color: #1a2936; padding: 15px; border-radius: 6px;
            margin-bottom: 15px; border: 1px solid #2b475e; display: none; /* 初始隱藏 */
            font-size: 0.85rem; animation: fadeIn 0.5s;
        }
        .vol-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .vol-row:last-child { margin-bottom: 0; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        button {
            background-color: #007acc; color: white; border: none; padding: 12px;
            border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1rem;
            margin-bottom: 15px; transition: background 0.2s;
        }
        button:hover { background-color: #005999; }
        button:disabled { background-color: #444; color: #777; cursor: not-allowed; }
        #legend { background: #252525; padding: 15px; border-radius: 6px; font-size: 0.85rem; border: 1px solid #333; margin-bottom: 15px; }
        .legend-item { display: flex; align-items: center; margin-bottom: 8px; }
        .color-box { width: 16px; height: 16px; border-radius: 3px; margin-right: 10px; box-sizing: border-box; }
        #status { padding: 10px; background: #252525; border-radius: 4px; font-size: 0.85rem; color: #00ff66; text-align: center; margin-top: auto; }
        
        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; flex-direction: column; z-index: 100; display: none;
        }
        .spinner { border: 4px solid rgba(255,255,255,0.1); width: 60px; height: 60px; border-radius: 50%; border-left-color: #007acc; animation: spin 1s linear infinite; }
        #progress-text { font-size: 2rem; font-weight: bold; color: #007acc; margin-top: 15px; font-variant-numeric: tabular-nums; }
        #loading-subtext { margin-top: 5px; color: #aaa; font-size: 0.9rem; text-align: center; max-width: 80%; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>🦷 牙體復形 3D 雲端比對</h2>
        
        <div class="file-input-container">
            <label>1. Gold Standard (STL1)</label>
            <input type="file" id="stl1" accept=".stl">
        </div>
        
        <div class="file-input-container">
            <label>2. 待比對模型 (STL2)</label>
            <input type="file" id="stl2" accept=".stl">
        </div>
        
        <div class="slider-container">
            <label>距離容差 Tolerance: <span id="tol-val">0.05</span> mm</label>
            <input type="range" id="tolerance" min="0.01" max="0.30" step="0.01" value="0.05">
        </div>

        <div class="layer-control-container">
            <div style="font-weight: bold; margin-bottom: 8px; font-size: 0.85rem; color: #888;">3D 圖層顯示控制：</div>
            <label class="layer-checkbox">
                <input type="checkbox" id="toggle-stl1" checked> 顯示 Gold Standard (紅色區)
            </label>
            <label class="layer-checkbox">
                <input type="checkbox" id="toggle-stl2" checked> 顯示 待比對模型 (藍色區)
            </label>
        </div>

        <button id="compare-btn" disabled>開始多執行緒安全比對</button>

        <div id="volume-results">
            <div style="font-weight: bold; margin-bottom: 10px; color: #00ff66; border-bottom: 1px solid #2b475e; padding-bottom: 5px;">📊 體積量化分析報告：</div>
            <div class="vol-row"><span>標準牙齒總體積:</span><span id="vol-total" style="font-weight:bold; color:#fff;">-</span></div>
            <div class="vol-row" style="color: #ff6666;"><span>修磨不足體積:</span><span><span id="vol-under">-</span> (<span id="pct-under">-</span>)</span></div>
            <div class="vol-row" style="color: #66a3ff;"><span>過度修磨體積:</span><span><span id="vol-over">-</span> (<span id="pct-over">-</span>)</span></div>
        </div>
        
        <div id="legend">
            <div style="font-weight: bold; margin-bottom: 10px; color: #fff;">透視圖例說明：</div>
            <div class="legend-item">
                <div class="color-box" style="background-color: rgba(180,180,180,0.2); border: 1px dashed #666;"></div>
                <span>半透明灰色：結構符合標準</span>
            </div>
            <div class="legend-item">
                <div class="color-box" style="background-color: rgba(255,0,0,0.5); border: 1px solid #ff0000;"></div>
                <span>半透明紅色：修磨不足 (Under-prep)</span>
            </div>
            <div class="legend-item">
                <div class="color-box" style="background-color: rgba(26,76,255,0.5); border: 1px solid #1a4cff;"></div>
                <span>半透明藍色：過度修磨 (Over-prep)</span>
            </div>
        </div>
        
        <div id="status">系統就緒，等待上傳檔案</div>
    </div>

    <div id="canvas-container">
        <div id="loading-overlay">
            <div class="spinner"></div>
            <div id="progress-text">0%</div>
            <p id="loading-subtext">安全雲端環境已就緒...</p>
        </div>
    </div>

    <script>
        // =========================================================================
        // 🚀 核心優化：將背景演算法重構為「面片三角微元積分法」，同步產出顏色與體積數據
        // =========================================================================
        const workerCode = `
            self.onmessage = function(e) {
                const { pos1, pos2, tol, cellSize } = e.data;
                
                const colors1 = new Float32Array((pos1.length / 3) * 4);
                const colors2 = new Float32Array((pos2.length / 3) * 4);

                const grid1 = {}, grid2 = {};

                // 建立空間雜湊索引
                for (let i = 0; i < pos1.length; i += 3) {
                    const key = Math.floor(pos1[i]/cellSize) + ',' + Math.floor(pos1[i+1]/cellSize) + ',' + Math.floor(pos1[i+2]/cellSize);
                    if (!grid1[key]) grid1[key] = [];
                    grid1[key].push(i);
                }
                for (let i = 0; i < pos2.length; i += 3) {
                    const key = Math.floor(pos2[i]/cellSize) + ',' + Math.floor(pos2[i+1]/cellSize) + ',' + Math.floor(pos2[i+2]/cellSize);
                    if (!grid2[key]) grid2[key] = [];
                    grid2[key].push(i);
                }

                const totalVerts1 = pos1.length / 3;
                const totalVerts2 = pos2.length / 3;
                const totalWork = totalVerts1 + totalVerts2;
                let lastReportedPercent = -1;

                // 1. 利用高斯散度定理計算 Gold Standard 的真實精準總體積
                let totalVolume1 = 0;
                for (let i = 0; i < pos1.length; i += 9) {
                    const ax = pos1[i], ay = pos1[i+1], az = pos1[i+2];
                    const bx = pos1[i+3], by = pos1[i+4], bz = pos1[i+5];
                    const cx = pos1[i+6], cy = pos1[i+7], cz = pos1[i+8];
                    const vSign = (ax * (by * cz - bz * cy) - ay * (bx * cz - bz * cx) + az * (bx * cy - by * cx)) / 6.0;
                    totalVolume1 += vSign;
                }
                totalVolume1 = Math.abs(totalVolume1); // 取絕對值，防範三角形法線反向

                // 最近距離查詢輔助函數
                function getMinDist(x, y, z, grid, pos) {
                    const gx = Math.floor(x / cellSize), gy = Math.floor(y / cellSize), gz = Math.floor(z / cellSize);
                    let minDist = Infinity;
                    for (let dx = -1; dx <= 1; dx++) {
                        for (let dy = -1; dy <= 1; dy++) {
                            for (let dz = -1; dz <= 1; dz++) {
                                const indices = grid[(gx+dx) + ',' + (gy+dy) + ',' + (gz+dz)];
                                if (indices) {
                                    for (let j = 0; j < indices.length; j++) {
                                        const idx = indices[j];
                                        const d = Math.sqrt((x-pos[idx])**2 + (y-pos[idx+1])**2 + (z-pos[idx+2])**2);
                                        if (d < minDist) minDist = d;
                                    }
                                }
                            }
                        }
                    }
                    return minDist;
                }

                // 2. 逐面片（i+=9）計算 STL1 (Gold Standard) 的修磨不足體積
                let cIdx1 = 0;
                let underPrepVolume = 0;
                for (let i = 0; i < pos1.length; i += 9) {
                    const ax = pos1[i], ay = pos1[i+1], az = pos1[i+2];
                    const bx = pos1[i+3], by = pos1[i+4], bz = pos1[i+5];
                    const cx = pos1[i+6], cy = pos1[i+7], cz = pos1[i+8];

                    // 外積計算三角面片面積
                    const abx = bx - ax, aby = by - ay, abz = bz - az;
                    const acx = cx - ax, acy = cy - ay, acz = cz - az;
                    const cX = aby * acz - abz * acy, cY = abz * acx - abx * acz, cZ = abx * acy - aby * acx;
                    const faceArea = 0.5 * Math.sqrt(cX*cX + cY*cY + cZ*cZ);
                    const vertexArea = faceArea / 3.0; // 分配給三個頂點的微元面積

                    // 處理頂點 1
                    let dA = getMinDist(ax, ay, az, grid2, pos2);
                    if (dA <= tol) {
                        colors1[cIdx1] = 0.7; colors1[cIdx1+1] = 0.7; colors1[cIdx1+2] = 0.7; colors1[cIdx1+3] = 0.2;
                    } else {
                        colors1[cIdx1] = 1.0; colors1[cIdx1+1] = 0.0; colors1[cIdx1+2] = 0.0; colors1[cIdx1+3] = 0.5;
                        underPrepVolume += vertexArea * dA; // 面積 x 厚度 = 微元體積積分
                    }
                    cIdx1 += 4;

                    // 處理頂點 2
                    let dB = getMinDist(bx, by, bz, grid2, pos2);
                    if (dB <= tol) {
                        colors1[cIdx1] = 0.7; colors1[cIdx1+1] = 0.7; colors1[cIdx1+2] = 0.7; colors1[cIdx1+3] = 0.2;
                    } else {
                        colors1[cIdx1] = 1.0; colors1[cIdx1+1] = 0.0; colors1[cIdx1+2] = 0.0; colors1[cIdx1+3] = 0.5;
                        underPrepVolume += vertexArea * dB;
                    }
                    cIdx1 += 4;

                    // 處理頂點 3
                    let dC = getMinDist(cx, cy, cz, grid2, pos2);
                    if (dC <= tol) {
                        colors1[cIdx1] = 0.7; colors1[cIdx1+1] = 0.7; colors1[cIdx1+2] = 0.7; colors1[cIdx1+3] = 0.2;
                    } else {
                        colors1[cIdx1] = 1.0; colors1[cIdx1+1] = 0.0; colors1[cIdx1+2] = 0.0; colors1[cIdx1+3] = 0.5;
                        underPrepVolume += vertexArea * dC;
                    }
                    cIdx1 += 4;

                    if ((i / 9) % 500 === 0) {
                        const percent = Math.round(((i / 3) / totalWork) * 100);
                        if (percent !== lastReportedPercent) {
                            self.postMessage({ type: 'progress', percent: percent, msg: '計算 Gold Standard 容積積分...' });
                            lastReportedPercent = percent;
                        }
                    }
                }

                // 3. 逐面片（i+=9）計算 STL2 (待比對模型) 的過度修磨體積
                let cIdx2 = 0;
                let overPrepVolume = 0;
                for (let i = 0; i < pos2.length; i += 9) {
                    const ax = pos2[i], ay = pos2[i+1], az = pos2[i+2];
                    const bx = pos2[i+3], by = pos2[i+4], bz = pos2[i+5];
                    const cx = pos2[i+6], cy = pos2[i+7], cz = pos2[i+8];

                    const abx = bx - ax, aby = by - ay, abz = bz - az;
                    const acx = cx - ax, acy = cy - ay, acz = cz - az;
                    const cX = aby * acz - abz * acy, cY = abz * acx - abx * acz, cZ = abx * acy - aby * acx;
                    const faceArea = 0.5 * Math.sqrt(cX*cX + cY*cY + cZ*cZ);
                    const vertexArea = faceArea / 3.0;

                    // 處理頂點 1
                    let dA = getMinDist(ax, ay, az, grid1, pos1);
                    if (dA <= tol) {
                        colors2[cIdx2] = 0.0; colors2[cIdx2+1] = 0.0; colors2[cIdx2+2] = 0.0; colors2[cIdx2+3] = 0.0;
                    } else {
                        colors2[cIdx2] = 0.1; colors2[cIdx2+1] = 0.3; colors2[cIdx2+2] = 1.0; colors2[cIdx2+3] = 0.5;
                        overPrepVolume += vertexArea * dA;
                    }
                    cIdx2 += 4;

                    // 處理頂點 2
                    let dB = getMinDist(bx, by, bz, grid1, pos1);
                    if (dB <= tol) {
                        colors2[cIdx2] = 0.0; colors2[cIdx2+1] = 0.0; colors2[cIdx2+2] = 0.0; colors2[cIdx2+3] = 0.0;
                    } else {
                        colors2[cIdx2] = 0.1; colors2[cIdx2+1] = 0.3; colors2[cIdx2+2] = 1.0; colors2[cIdx2+3] = 0.5;
                        overPrepVolume += vertexArea * dB;
                    }
                    cIdx2 += 4;

                    // 處理頂點 3
                    let dC = getMinDist(cx, cy, cz, grid1, pos1);
                    if (dC <= tol) {
                        colors2[cIdx2] = 0.0; colors2[cIdx2+1] = 0.0; colors2[cIdx2+2] = 0.0; colors2[cIdx2+3] = 0.0;
                    } else {
                        colors2[cIdx2] = 0.1; colors2[cIdx2+1] = 0.3; colors2[cIdx2+2] = 1.0; colors2[cIdx2+3] = 0.5;
                        overPrepVolume += vertexArea * dC;
                    }
                    cIdx2 += 4;

                    if ((i / 9) % 500 === 0) {
                        const percent = Math.round(((totalVerts1 + (i / 3)) / totalWork) * 100);
                        if (percent !== lastReportedPercent) {
                            self.postMessage({ type: 'progress', percent: percent, msg: '計算待比對模型容積積分...' });
                            lastReportedPercent = percent;
                        }
                    }
                }

                // 將算出的三組體積數據一同包裝打包回傳
                self.postMessage({ 
                    type: 'done', colors1, colors2, totalVolume1, underPrepVolume, overPrepVolume 
                }, [colors1.buffer, colors2.buffer]);
            };
        `;

        const blob = new Blob([workerCode], { type: 'application/javascript' });
        const geometryWorker = new Worker(URL.createObjectURL(blob));

        // ==========================================
        // 初始化 WebGL 3D 畫布環境
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x121212);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 0, 50);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        scene.add(new THREE.AmbientLight(0x555555));
        const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.7);
        dirLight1.position.set(1, 1, 1).normalize();
        scene.add(dirLight1);
        const dirLight2 = new THREE.DirectionalLight(0x999999, 0.5);
        dirLight2.position.set(-1, -1, 1).normalize();
        scene.add(dirLight2);

        let geometry1, geometry2, mesh1, mesh2;
        const loader = new THREE.STLLoader();

        const file1Input = document.getElementById('stl1');
        const file2Input = document.getElementById('stl2');
        const compareBtn = document.getElementById('compare-btn');
        const toleranceInput = document.getElementById('tolerance');
        const tolValDisplay = document.getElementById('tol-val');
        const statusDiv = document.getElementById('status');
        
        const loadingOverlay = document.getElementById('loading-overlay');
        const progressText = document.getElementById('progress-text');
        const loadingSubtext = document.getElementById('loading-subtext');

        const toggleStl1Check = document.getElementById('toggle-stl1');
        const toggleStl2Check = document.getElementById('toggle-stl2');

        toleranceInput.addEventListener('input', (e) => { tolValDisplay.innerText = e.target.value; });

        function checkInputs() {
            compareBtn.disabled = !(file1Input.files.length && file2Input.files.length);
            if(!compareBtn.disabled) statusDiv.innerText = "🟢 網格數據就緒，可執行多執行緒半透視比對";
        }
        file1Input.addEventListener('change', checkInputs);
        file2Input.addEventListener('change', checkInputs);

        toggleStl1Check.addEventListener('change', () => { if (mesh1) mesh1.visible = toggleStl1Check.checked; });
        toggleStl2Check.addEventListener('change', () => { if (mesh2) mesh2.visible = toggleStl2Check.checked; });

        compareBtn.addEventListener('click', () => {
            loadingOverlay.style.display = 'flex';
            progressText.innerText = "0%";
            loadingSubtext.innerText = "正在解讀 3D STL 檔案編碼...";
            // 隱藏上一次的報告面版
            document.getElementById('volume-results').style.display = 'none';
            
            setTimeout(() => {
                const reader1 = new FileReader();
                reader1.onload = function (e1) {
                    geometry1 = loader.parse(e1.target.result);
                    const reader2 = new FileReader();
                    reader2.onload = function (e2) {
                        geometry2 = loader.parse(e2.target.result);
                        loadingSubtext.innerText = "正在進行 3D 空間座標系重心對齊...";
                        
                        setTimeout(() => {
                            alignCenterOfMass(geometry1, geometry2);

                            const pos1Array = geometry1.attributes.position.array;
                            const pos2Array = geometry2.attributes.position.array;
                            const p1Copy = pos1Array.slice();
                            const p2Copy = pos2Array.slice();

                            geometryWorker.postMessage({
                                pos1: p1Copy, pos2: p2Copy,
                                tol: parseFloat(toleranceInput.value), cellSize: 0.5
                            }, [p1Copy.buffer, p2Copy.buffer]);
                        }, 30);
                    };
                    reader2.readAsArrayBuffer(file2Input.files[0]);
                };
                reader1.readAsArrayBuffer(file1Input.files[0]);
            }, 30);
        });

        // ==========================================
        // 📡 接收數據與渲染報告
        // ==========================================
        geometryWorker.onmessage = function(e) {
            const data = e.data;
            if (data.type === 'progress') {
                progressText.innerText = data.percent + "%";
                loadingSubtext.innerText = `${data.msg}`;
            } 
            else if (data.type === 'done') {
                progressText.innerText = "100%";
                loadingSubtext.innerText = "比對完成！正在渲染量化報告報告...";
                
                setTimeout(() => {
                    if(mesh1) scene.remove(mesh1);
                    if(mesh2) scene.remove(mesh2);

                    geometry1.setAttribute('color', new THREE.BufferAttribute(data.colors1, 4));
                    geometry2.setAttribute('color', new THREE.BufferAttribute(data.colors2, 4));

                    const material = new THREE.MeshStandardMaterial({
                        vertexColors: true, roughness: 0.3, metalness: 0.1, side: THREE.DoubleSide, transparent: true, depthWrite: true,
                    });

                    mesh1 = new THREE.Mesh(geometry1, material);
                    mesh2 = new THREE.Mesh(geometry2, material);

                    mesh1.visible = toggleStl1Check.checked;
                    mesh2.visible = toggleStl2Check.checked;

                    scene.add(mesh1);
                    scene.add(mesh2);

                    geometry1.computeBoundingSphere();
                    const center = geometry1.boundingSphere.center;
                    controls.target.copy(center);
                    camera.position.set(center.x, center.y, center.z + geometry1.boundingSphere.radius * 2);
                    controls.update();

                    // 💡 主執行緒更新：計算百分比並渲染量化報告報告面版
                    const pctUnder = ((data.underPrepVolume / data.totalVolume1) * 100).toFixed(2);
                    const pctOver = ((data.overPrepVolume / data.totalVolume1) * 100).toFixed(2);

                    document.getElementById('vol-total').innerText = data.totalVolume1.toFixed(1) + " mm³";
                    document.getElementById('vol-under').innerText = data.underPrepVolume.toFixed(2) + " mm³";
                    document.getElementById('pct-under').innerText = pctUnder + "%";
                    document.getElementById('vol-over').innerText = data.overPrepVolume.toFixed(2) + " mm³";
                    document.getElementById('pct-over').innerText = pctOver + "%";
                    
                    // 展現報告面板
                    document.getElementById('volume-results').style.display = 'block';

                    loadingOverlay.style.display = 'none';
                    statusDiv.innerText = "🎉 比對完成！體積量化分析已出爐。";
                }, 30);
            }
        };

        function alignCenterOfMass(geo1, geo2) {
            geo1.computeBoundingBox(); geo2.computeBoundingBox();
            const center1 = new THREE.Vector3(), center2 = new THREE.Vector3();
            geo1.boundingBox.getCenter(center1); geo2.boundingBox.getCenter(center2);
            const pos1 = geo1.attributes.position.array;
            for (let i = 0; i < pos1.length; i += 3) {
                pos1[i] -= center1.x; pos1[i+1] -= center1.y; pos1[i+2] -= center1.z;
            }
            const pos2 = geo2.attributes.position.array;
            for (let i = 0; i < pos2.length; i += 3) {
                pos2[i] -= center2.x; pos2[i+1] -= center2.y; pos2[i+2] -= center2.z;
            }
            geo1.attributes.position.needsUpdate = true; geo2.attributes.position.needsUpdate = true;
            geo1.computeVertexNormals(); geo2.computeVertexNormals();
        }

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight; camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
        animate();
    </script>
</body>
